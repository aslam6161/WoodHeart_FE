name: CI

on:
  push:
    # Long-lived branches plus the working branches described in CONTRIBUTING.md.
    # Pushing to a phase branch runs the full suite, so the pull request opens
    # with its checks already green rather than pending.
    branches:
      - main
      - develop
      - 'phase/**'
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
  # No paths filter on pull_request, deliberately. These jobs are required
  # status checks, and a required check that never runs sits "expected" for ever
  # and blocks the merge.
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  branch-name:
    name: Branch Name
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      # Cheap, and it catches the mistake before a reviewer has to. The names
      # are not cosmetic: cd.yml and the branch protection rules both key off
      # them, so a branch called "my-stuff" silently skips checks it should run.
      - name: Check the source branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          # develop → main is the release pull request; it is exempt by design.
          if [ "$BRANCH" = "develop" ]; then
            echo "Release pull request from develop — no name check."
            exit 0
          fi
          if echo "$BRANCH" | grep -Eq '^(phase|feature|fix|chore|docs|refactor)/[a-z0-9][a-z0-9._-]*$'; then
            echo "OK: $BRANCH"
            exit 0
          fi
          echo "::error::Branch '$BRANCH' does not match the convention."
          echo "Expected <type>/<slug>, lower-case, where type is one of:"
          echo "  phase feature fix chore docs refactor"
          echo "Examples: phase/1-catalog, fix/cart-total-rounding"
          echo "See CONTRIBUTING.md."
          exit 1

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Reads .nvmrc, so CI and every developer machine track one version.
          node-version-file: '.nvmrc'
          cache: npm

      # `npm ci`, not `npm install`: it installs exactly what the lockfile says
      # and fails if package.json and the lockfile disagree. That is what you
      # want in CI and never what you want locally.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      # Angular 21 runs unit tests on Vitest, not Karma — there is no
      # --browsers flag, and passing one fails the step.
      - name: Unit tests
        run: npm test -- --watch=false

      - name: Build (production, with SSR)
        run: npm run build -- --configuration production

      # The production build above already fails on a budget breach, so this
      # step only reports. The figure worth watching is the gzipped transfer
      # size rather than the raw total: Bootstrap's CSS is ~227 kB raw but
      # ~23 kB over the wire, and this storefront is served to mid-range
      # phones on 4G.
      - name: Report bundle size
        run: du -sh dist/ || true

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install
        run: npm ci

      # Reports everything, but only fails on high and critical. A CI that goes
      # red over a low-severity advisory in a build-time dependency is a CI
      # whose red you learn to ignore.
      - name: npm audit
        run: |
          npm audit || true
          npm audit --audit-level=high

  docker-image:
    name: Docker Image Builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Builds but does not push. A Dockerfile that only gets exercised on a
      # merge to main is a Dockerfile that breaks on the day you most need it.
      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
