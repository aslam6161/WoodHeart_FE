name: AI Review

# An automated first-pass review on every pull request into develop or main.
#
# It does not replace the human reviewer and it cannot approve anything. What
# it does is arrive within a couple of minutes and catch the things a tired
# reviewer skims past — a component that will not hydrate, a subscription
# nobody unsubscribes, an error message that leaks an ErrorCode to a customer.
#
# Requires one repository secret: ANTHROPIC_API_KEY.
#   gh secret set ANTHROPIC_API_KEY --repo aslam6161/WoodHeart_FE
# Without it every job below no-ops with a notice instead of failing.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, develop]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  # One review per pull request. Pushing three commits in a row should produce
  # one review of the final state, not three reviews of three intermediate ones.
  group: ai-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude Review
    runs-on: ubuntu-latest
    # Drafts are work in progress; reviewing them is noise.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The secrets context is not usable in a job-level `if`, and a pull
      # request from a fork never receives secrets at all. So the guard lives
      # here: no key means a notice and a green check, not a red one.
      - name: Is the API key configured?
        id: guard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY is not set — skipping the AI review."
          fi

      - name: Review the diff
        if: steps.guard.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--model claude-opus-5 --allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api:*)"'
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in
            ${{ github.repository }} — the WoodHeart storefront and admin, an
            Angular 21 app for an interior design business in Bangladesh. It is
            zoneless, standalone, signal-based, and server-side rendered.

            Read CONTRIBUTING.md first. Leave inline comments on specific lines.
            Prioritise, in order:

            1. Correctness bugs — wrong results, unhandled nulls, a subscription
               nobody unsubscribes, a race between two async calls.
            2. Things that break server-side rendering. This app renders on the
               server, so `window`, `document`, `localStorage` and `setTimeout`
               used unguarded in a constructor or field initialiser will throw
               during SSR and silently degrade the page to client-only. Guard
               with `isPlatformBrowser`, or move the work to `afterNextRender`.
            3. Zoneless change detection. The app runs with
               `provideZonelessChangeDetection()`, so mutating a plain field
               and expecting the view to update does not work. State that the
               template reads must be a signal.
            4. The API seam:
                  - Every response is a `GeneralResponse`. Unpack one envelope,
                    not two.
                  - Branch on `ErrorCode`, never on `Message` — the message gets
                    reworded and translated to Bangla, and matching on it breaks
                    silently.
                  - Never show a raw `ErrorCode` to a customer.
                  - Paged endpoints go through `paginationHelper`, which reads
                    the `X-Pagination` header.
            5. Performance on a mid-range phone on 4G, which is the real
               audience: eager imports that should be lazy routes, images with
               no dimensions causing layout shift, anything that pushes the
               initial bundle toward the 700 kB budget.
            6. Accessibility on interactive elements — a `div` with a click
               handler is not a button, and form inputs need labels.

            Be specific and concrete: point at the line, say what breaks, say
            what to do instead. Skip style and formatting — Prettier already
            owns that, and a review full of nitpicks is a review nobody reads.

            If the change is small and clean, say so in one line. Do not invent
            problems to look thorough. Do not approve or request changes as a
            formal review state; a human does that.

  mention:
    name: Claude Mention
    runs-on: ubuntu-latest
    # Lets a reviewer pull the agent back in on a specific thread:
    # "@claude will this run during SSR?"
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Is the API key configured?
        id: guard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY is not set — skipping."
          fi

      - name: Answer the mention
        if: steps.guard.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--model claude-opus-5'
